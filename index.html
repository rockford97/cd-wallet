<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141516">
<title>CD Wallet</title>
<style>
:root{--header:34px;--toolbar:64px;--bg:#141516}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{height:100dvh;display:flex;flex-direction:column}
header{height:var(--header);flex:0 0 var(--header);padding:9px 15px 4px;display:flex;align-items:end;justify-content:space-between}
#count{font-size:10px;color:#929598;letter-spacing:.1em}.end-jump{border:0;background:none;color:#aeb1b3;font-size:17px;line-height:1;padding:0 2px 0 12px;cursor:pointer}.end-jump:active{color:#fff}
.stage{flex:1 1 auto;min-height:0;width:100%;padding:2px 8px 6px;display:flex;justify-content:center;align-items:stretch}
.case{position:relative;width:100%;max-width:480px;height:100%;min-height:0;border-radius:19px;background:radial-gradient(ellipse at 18% 8%,rgba(255,255,255,.04),transparent 34%),radial-gradient(ellipse at 80% 75%,rgba(0,0,0,.38),transparent 55%),repeating-linear-gradient(43deg,rgba(255,255,255,.018) 0 1px,rgba(0,0,0,.035) 1px 3px),repeating-linear-gradient(-43deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),#202122;border:2px solid #090a0a;box-shadow:0 6px 17px rgba(0,0,0,.72),inset 0 0 20px rgba(0,0,0,.75)}
.case:after{content:"";position:absolute;inset:6px;border-radius:14px;border:2px solid rgba(105,108,110,.6);pointer-events:none}.case:before{content:"";position:absolute;inset:12px;border-radius:11px;border:1px dashed rgba(160,163,165,.36);pointer-events:none}
.page-stack{position:absolute;z-index:1;top:24px;left:25px;right:18px;bottom:27px;border-radius:3px;background:#121314;box-shadow:3px 3px 0 rgba(200,205,205,.13),6px 6px 0 rgba(0,0,0,.7),8px 8px 0 rgba(180,185,185,.08)}
#sheetHost{position:absolute;z-index:5;top:20px;bottom:30px;left:18px;right:18px}.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr;gap:0;transform-origin:50% 92%;will-change:transform,opacity;touch-action:none;user-select:none}.sheet{position:relative;min-width:0;min-height:0}
.plastic{position:absolute;inset:0;padding:5px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:4px;border-radius:3px;background:linear-gradient(115deg,rgba(255,255,255,.095),rgba(255,255,255,.018) 21%,rgba(255,255,255,.015) 48%,rgba(255,255,255,.065) 68%,rgba(255,255,255,.015)),rgba(190,200,202,.045);border:1px solid rgba(220,225,225,.28);box-shadow:0 3px 7px rgba(0,0,0,.72),inset 0 0 10px rgba(255,255,255,.04)}
.plastic:before{content:"";position:absolute;z-index:5;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(to right,rgba(255,255,255,.17),rgba(0,0,0,.22));pointer-events:none}.plastic:after{content:"";position:absolute;z-index:8;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 17%,transparent 28%,transparent 67%,rgba(255,255,255,.035) 79%,transparent 100%)}
.album{position:relative;min-width:0;min-height:0;padding:2px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(225,230,230,.16);background:rgba(255,255,255,.015);box-shadow:inset 0 0 7px rgba(255,255,255,.025)}
.album:before{content:"";position:absolute;z-index:5;left:0;right:0;bottom:0;height:4px;border-top:1px solid rgba(255,255,255,.18);background:linear-gradient(to bottom,rgba(255,255,255,.05),rgba(255,255,255,.01));pointer-events:none}.album:after{content:"";position:absolute;z-index:6;left:1px;right:1px;top:0;height:13%;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(to bottom,rgba(255,255,255,.07),rgba(255,255,255,.012));pointer-events:none}
.cover{display:block;width:100%;max-width:100%;max-height:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(135deg,#343638,#242627);box-shadow:0 2px 5px rgba(0,0,0,.9);pointer-events:none}.cover.loading{opacity:.3}.album-label{position:absolute;z-index:20;left:6px;right:6px;bottom:8px;padding:6px 7px;border-radius:5px;background:rgba(10,11,12,.9);color:#fff;font-size:10px;line-height:1.25;text-align:center;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.55)}.album.show-label .album-label{opacity:1;transform:none}@media(hover:hover) and (pointer:fine){.album:hover .album-label{opacity:1;transform:none}}
.page-number{position:absolute;z-index:12;left:50%;bottom:33px;transform:translateX(-50%);padding:2px 7px;border-radius:8px;background:rgba(15,16,17,.72);color:#aaa;font-size:8px;letter-spacing:.12em;pointer-events:none}
.toolbar{flex:0 0 calc(var(--toolbar) + env(safe-area-inset-bottom));height:calc(var(--toolbar) + env(safe-area-inset-bottom));padding:5px 3px env(safe-area-inset-bottom);display:flex;background:#171819;border-top:1px solid #393b3d;z-index:30}.tool{flex:1;min-width:0;border:0;background:none;color:#d8d8d8;padding:2px;font-size:9px;letter-spacing:.03em;text-transform:uppercase}.icon{position:relative;display:block;width:22px;height:25px;margin:auto;color:#ddd}.icon-random:before{content:"";position:absolute;left:7px;top:3px;width:7px;height:14px;border-left:2px solid currentColor;transform:skew(-18deg) rotate(12deg)}.icon-random:after{content:"";position:absolute;left:8px;bottom:3px;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(42deg)}.icon-filter:before{content:"";position:absolute;left:4px;top:5px;width:14px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 10px 0 currentColor}.icon-sort:before{content:"↕";position:absolute;inset:0;font:23px/24px Arial;text-align:center}.icon-search:before{content:"";position:absolute;width:8px;height:8px;left:5px;top:5px;border:2px solid currentColor;border-radius:50%}.icon-search:after{content:"";position:absolute;width:7px;height:2px;left:12px;top:14px;background:currentColor;transform:rotate(-45deg);transform-origin:left center}.icon-jump:before{content:"#";position:absolute;inset:0;font:20px/24px Arial;text-align:center}
.panel{display:none;position:fixed;z-index:100;inset:0;padding:22px 18px calc(30px + env(safe-area-inset-bottom));overflow-y:auto;background:#1b1c1df8}.panel.open{display:block}.panel h2{margin:20px 0;font-size:21px}.close{position:absolute;right:14px;top:8px;border:0;background:none;color:#fff;font-size:32px}.option{width:100%;padding:15px 2px;text-align:left;border:0;border-bottom:1px solid #3e4042;background:none;color:#eee;font-size:15px}.option.active{font-weight:700}.section{margin:22px 0 5px;color:#8f9294;font-size:10px;text-transform:uppercase;letter-spacing:.12em}input{width:100%;padding:14px;border:1px solid #484a4c;border-radius:7px;background:#292b2d;color:#fff;font-size:16px}.empty{grid-column:1/3;grid-row:1/4;align-self:center;text-align:center;color:#888}
@media(min-width:800px){:root{--header:40px;--toolbar:66px}.stage{padding:4px 20px 10px}.case{max-width:1000px}.page-stack{left:32px;right:25px}.spread{grid-template-columns:1fr 1fr;gap:10px}.spread:after{content:"";position:absolute;z-index:20;left:50%;top:-4px;bottom:-4px;width:12px;transform:translateX(-50%);background:linear-gradient(to right,rgba(0,0,0,.35),rgba(255,255,255,.07),rgba(0,0,0,.45));box-shadow:0 0 8px rgba(0,0,0,.65);pointer-events:none}.sheet:first-child .plastic{border-radius:4px 1px 1px 4px}.sheet:last-child .plastic{border-radius:1px 4px 4px 1px}}
@media(max-height:700px){:root{--header:28px;--toolbar:58px}#sheetHost{top:18px;bottom:27px}.page-stack{top:22px;bottom:24px}.page-number{bottom:30px}}
</style>
</head>
<body>
<header><div id="count">LOADING…</div><button class="end-jump" type="button" onclick="jumpToEnd()" aria-label="Jump to last page" title="Last page">⇥</button></header>
<main class="stage"><div class="case"><div class="page-stack"></div><div id="sheetHost"></div><div class="page-number" id="pageNumber"></div></div></main>
<nav class="toolbar">
<button class="tool" onclick="randomAlbum()"><span class="icon icon-random"></span>Random</button>
<button class="tool" onclick="openPanel('filter')"><span class="icon icon-filter"></span>Filter</button>
<button class="tool" onclick="openPanel('sort')"><span class="icon icon-sort"></span>Sort</button>
<button class="tool" onclick="openPanel('search')"><span class="icon icon-search"></span>Search</button>
<button class="tool" onclick="openJump()"><span class="icon icon-jump"></span>Jump</button>
</nav>
<div class="panel" id="sort"><button class="close" onclick="closePanels()">×</button><h2>Sort</h2>
<button class="option" onclick="setSort('az')">Artist A–Z</button><button class="option" onclick="setSort('za')">Artist Z–A</button><button class="option" onclick="setSort('old')">Release date — oldest first</button><button class="option" onclick="setSort('new')">Release date — newest first</button><button class="option" onclick="setSort('historicOld')">Historic — oldest first</button><button class="option" onclick="setSort('historicNew')">Historic — newest first</button></div>
<div class="panel" id="search"><button class="close" onclick="closePanels()">×</button><h2>Search</h2><input id="searchBox" placeholder="Artist or album" oninput="page=0;render()"></div>
<div class="panel" id="filter"><button class="close" onclick="closePanels()">×</button><h2>Filter</h2><div id="filters"></div></div>
<div class="panel" id="jump"><button class="close" onclick="closePanels()">×</button><h2>Jump to Page</h2><input id="jumpBox" type="number" min="1" inputmode="numeric" placeholder="Page number"><button class="option" onclick="jumpToPage()">Go to page</button></div>
<script>
let albums=[],page=0,sort="az",genre=null,mood=null,decade=null,visibleAlbums=[],dragging=false,startX=0,startY=0,dx=0,ignoreClick=false;
const host=document.getElementById("sheetHost");
const isDesktop=()=>window.matchMedia("(min-width:800px)").matches;
const perView=()=>isDesktop()?12:6;

function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=""}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=""}else field+=c}}if(field||row.length){row.push(field);rows.push(row)}const h=rows.shift();return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])))}

async function loadAlbums(){try{
const SHEET_ID='1jnhMnwfeY4QH002judHlnaOEkQ4_QJyjD_EDqljGomQ';
const url='https://docs.google.com/spreadsheets/d/e/2PACX-1vTT1IN5Pd_xEDDGwXWAdl5Dt7uNLravZlngHmQzLzd0OQy_VnTYrpMkC8M_jwNm80Bc8uolY6X7BHAd/pub?gid=1264302233&single=true&output=csv&cacheBust='+Date.now();
const res=await fetch(url);if(!res.ok)throw new Error('Google Sheet could not be loaded');
const rows=parseCSV(await res.text());
albums=rows.map(r=>({
artist:r['Artist']||'',album:r['Album']||'',year:Number(r['Release Year']||r['Year'])||0,genre:r['Genre']||'Uncategorized',moods:[r['Mood 1'],r['Mood 2']].filter(Boolean),historic:Number(r['Acquired Year']||r['Historic Order'])||null,appleID:r['Apple ID']||null,spotifyURL:r['Spotify URL']||((r['Spotify ID']||'')?('https://open.spotify.com/album/'+r['Spotify ID']):null),artwork:null
})).filter(a=>a.artist&&a.album);
buildFilters();render()}catch(e){document.getElementById('count').textContent='ALBUM DATA ERROR';host.innerHTML='<div style="padding:30px;color:#bbb">Could not load the Google Sheet. Make sure the sheet is shared for public viewing.</div>';console.error(e)}}
function spotify(a){if(!a.spotifyURL)return;location.href=a.spotifyURL}
function normalize(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
async function resolveArtwork(a){if(a.artwork)return a.artwork;if(a.appleID){try{const d=await (await fetch('https://itunes.apple.com/lookup?id='+a.appleID+'&entity=album')).json();const r=d.results.find(x=>x.wrapperType==='collection'&&x.artworkUrl100);if(r){a.artwork=r.artworkUrl100.replace(/100x100bb/,'600x600bb').replace(/100x100/,'600x600');return a.artwork}}catch(e){}}
const terms=[a.artist+' '+a.album,a.album+' '+a.artist];for(const term of terms){try{const d=await (await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&entity=album&country=US&limit=25')).json();let best=null,bestScore=-999;const ta=normalize(a.artist),tt=normalize(a.album);for(const r of d.results||[]){const ra=normalize(r.artistName||''),rt=normalize(r.collectionName||'');let s=0;if(ra===ta)s+=20;else if(ra.includes(ta)||ta.includes(ra))s+=12;if(rt===tt)s+=25;else if(rt.includes(tt)||tt.includes(rt))s+=15;if(r.releaseDate){const diff=Math.abs(new Date(r.releaseDate).getFullYear()-a.year);if(diff===0)s+=6;else if(diff<=2)s+=4;else if(diff<=5)s+=1}const t=(r.collectionName||'').toLowerCase();if(t.includes('tribute'))s-=30;if(t.includes('karaoke'))s-=40;if(t.includes('instrumental'))s-=20;if(t.includes('single'))s-=15;if(s>bestScore){bestScore=s;best=r}}if(best?.artworkUrl100){a.artwork=best.artworkUrl100.replace(/100x100bb/,'600x600bb').replace(/100x100/,'600x600');return a.artwork}}catch(e){}}return null}
async function loadArtwork(a,img){const u=await resolveArtwork(a);if(u){img.src=u;img.classList.remove('loading')}}
function filtered(){const q=(document.getElementById('searchBox').value||'').toLowerCase();let v=albums.filter(a=>(!genre||a.genre===genre)&&(!mood||a.moods.includes(mood))&&(!decade||Math.floor(a.year/10)*10===decade)&&(!q||(a.artist+' '+a.album).toLowerCase().includes(q)));switch(sort){case'az':v.sort((a,b)=>a.artist.localeCompare(b.artist));break;case'za':v.sort((a,b)=>b.artist.localeCompare(a.artist));break;case'old':v.sort((a,b)=>a.year-b.year||a.artist.localeCompare(b.artist));break;case'new':v.sort((a,b)=>b.year-a.year||a.artist.localeCompare(b.artist));break;case'historicOld':v.sort((a,b)=>(a.historic??9999)-(b.historic??9999)||a.artist.localeCompare(b.artist));break;case'historicNew':v.sort((a,b)=>(b.historic??-1)-(a.historic??-1)||a.artist.localeCompare(b.artist))}return v}
function makeSheet(items){const sheet=document.createElement('div');sheet.className='sheet';const plastic=document.createElement('div');plastic.className='plastic';sheet.appendChild(plastic);if(!items.length){plastic.innerHTML='<div class="empty"></div>';return sheet}items.forEach(a=>{const pocket=document.createElement('div');pocket.className='album';pocket.title=a.artist+' — '+a.album;const img=document.createElement('img');img.className='cover loading';img.alt=a.artist+' — '+a.album;pocket.appendChild(img);const label=document.createElement('div');label.className='album-label';label.textContent=a.artist+' — '+a.album;pocket.appendChild(label);let holdTimer=null,longPressed=false;const clearHold=()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}};pocket.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){longPressed=false;holdTimer=setTimeout(()=>{longPressed=true;ignoreClick=true;pocket.classList.add('show-label')},500)}});pocket.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)clearHold()});pocket.addEventListener('pointerup',()=>{clearHold();if(longPressed){setTimeout(()=>pocket.classList.remove('show-label'),900)}});pocket.addEventListener('pointercancel',()=>{clearHold();pocket.classList.remove('show-label')});pocket.addEventListener('click',e=>{if(longPressed){e.preventDefault();longPressed=false;return}if(!ignoreClick)spotify(a)});plastic.appendChild(pocket);loadArtwork(a,img)});return sheet}
function render(){visibleAlbums=filtered();const pv=perView(),totalViews=Math.max(1,Math.ceil(visibleAlbums.length/pv));if(page>=totalViews)page=totalViews-1;host.innerHTML='';const spread=document.createElement('div');spread.className='spread';const start=page*pv;spread.appendChild(makeSheet(visibleAlbums.slice(start,start+6)));if(isDesktop())spread.appendChild(makeSheet(visibleAlbums.slice(start+6,start+12)));host.appendChild(spread);document.getElementById('count').textContent=visibleAlbums.length+' ALBUMS';const totalPhysical=Math.max(1,Math.ceil(visibleAlbums.length/6)),firstPhysical=page*(isDesktop()?2:1)+1;if(isDesktop()){const second=Math.min(firstPhysical+1,totalPhysical);document.getElementById('pageNumber').textContent=firstPhysical+(second>firstPhysical?'–'+second:'')+' / '+totalPhysical}else document.getElementById('pageNumber').textContent=firstPhysical+' / '+totalPhysical;bindSwipe(spread)}
function bindSwipe(el){el.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startY=e.clientY;dx=0;ignoreClick=false;el.setPointerCapture(e.pointerId);el.style.transition='none'});el.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-startX;const dy=e.clientY-startY;if(Math.abs(dx)>8)ignoreClick=true;if(Math.abs(dx)>Math.abs(dy)){e.preventDefault();el.style.transform=`translate3d(${dx}px,-${Math.min(9,Math.abs(dx)/20)}px,0) rotate(${dx/40}deg)`}});el.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;const threshold=Math.min(110,window.innerWidth*.15);Math.abs(dx)>threshold?turn(dx<0?1:-1,el):snapBack(el)});el.addEventListener('pointercancel',()=>{dragging=false;snapBack(el)})}
function snapBack(el){el.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';el.style.transform='translate3d(0,0,0) rotate(0deg)';setTimeout(()=>ignoreClick=false,210)}
function turn(dir,el){const total=Math.ceil(visibleAlbums.length/perView());if((dir===1&&page>=total-1)||(dir===-1&&page<=0)){snapBack(el);return}el.style.transition='transform .24s ease-in,opacity .2s ease-in';el.style.opacity='.15';el.style.transform=`translate3d(${dir===1?'-125vw':'125vw'},-14px,0) rotate(${dir===1?'-8deg':'8deg'})`;setTimeout(()=>{page+=dir;render();const n=host.firstChild;n.style.transition='none';n.style.transform=`translate3d(${dir===1?'20px':'-20px'},0,0)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.transition='transform .16s ease-out';n.style.transform='translate3d(0,0,0)'}));setTimeout(()=>ignoreClick=false,200)},220)}
function randomAlbum(){visibleAlbums=filtered();if(!visibleAlbums.length)return;spotify(visibleAlbums[Math.floor(Math.random()*visibleAlbums.length)])}
function jumpToEnd(){visibleAlbums=filtered();page=Math.max(0,Math.ceil(visibleAlbums.length/perView())-1);closePanels();render()}
function openJump(){visibleAlbums=filtered();const totalPhysical=Math.max(1,Math.ceil(visibleAlbums.length/6));const box=document.getElementById('jumpBox');box.max=totalPhysical;box.value='';box.placeholder='Page 1–'+totalPhysical;openPanel('jump');setTimeout(()=>box.focus(),60)}
function jumpToPage(){visibleAlbums=filtered();const totalPhysical=Math.max(1,Math.ceil(visibleAlbums.length/6));const requested=Math.max(1,Math.min(totalPhysical,parseInt(document.getElementById('jumpBox').value,10)||1));page=isDesktop()?Math.floor((requested-1)/2):requested-1;closePanels();render()}
document.getElementById('jumpBox').addEventListener('keydown',e=>{if(e.key==='Enter')jumpToPage()});
function openPanel(id){closePanels();document.getElementById(id).classList.add('open')}function closePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'))}function setSort(v){sort=v;page=0;closePanels();render()}
function addFilter(label,fn,active){const b=document.createElement('button');b.className='option'+(active?' active':'');b.textContent=label;b.onclick=fn;document.getElementById('filters').appendChild(b)}
function buildFilters(){const f=document.getElementById('filters');f.innerHTML='<div class="section">Genre</div>';addFilter('All genres',()=>{genre=null;page=0;buildFilters();render()},!genre);[...new Set(albums.map(a=>a.genre))].sort().forEach(g=>addFilter(g,()=>{genre=g;page=0;buildFilters();render()},genre===g));f.insertAdjacentHTML('beforeend','<div class="section">Mood</div>');addFilter('All moods',()=>{mood=null;page=0;buildFilters();render()},!mood);[...new Set(albums.flatMap(a=>a.moods))].sort().forEach(m=>addFilter(m,()=>{mood=m;page=0;buildFilters();render()},mood===m));f.insertAdjacentHTML('beforeend','<div class="section">Decade</div>');addFilter('All decades',()=>{decade=null;page=0;buildFilters();render()},!decade);[...new Set(albums.filter(a=>a.year).map(a=>Math.floor(a.year/10)*10))].sort((a,b)=>a-b).forEach(d=>addFilter(d+'s',()=>{decade=d;page=0;buildFilters();render()},decade===d))}
let lastDesktop=isDesktop();window.addEventListener('resize',()=>{const now=isDesktop();if(now!==lastDesktop){lastDesktop=now;page=0;render()}});
loadAlbums();
</script>
</body>
</html>
