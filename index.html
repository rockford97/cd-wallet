<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141516">
<title>My CD Wallet</title>

<style>
:root{
  --header:50px;
  --toolbar:64px;
  --bg:#141516;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:var(--header);
  flex:0 0 var(--header);
  padding:12px 15px 6px;
  display:flex;
  align-items:end;
  justify-content:space-between;
}

h1{
  margin:0;
  font-size:14px;
  letter-spacing:.14em;
  font-weight:650;
}

#count{
  font-size:10px;
  color:#929598;
  letter-spacing:.1em;
}

/* WALLET */

.stage{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  padding:2px 8px 6px;
  display:flex;
  justify-content:center;
  align-items:stretch;
}

.case{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  min-height:0;
  border-radius:19px;

  background:
    radial-gradient(
      ellipse at 18% 8%,
      rgba(255,255,255,.04),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 80% 75%,
      rgba(0,0,0,.38),
      transparent 55%
    ),
    repeating-linear-gradient(
      43deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 1px,
      rgba(0,0,0,.035) 1px,
      rgba(0,0,0,.035) 3px
    ),
    repeating-linear-gradient(
      -43deg,
      rgba(255,255,255,.012) 0px,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 3px
    ),
    #202122;

  border:2px solid #090a0a;

  box-shadow:
    0 6px 17px rgba(0,0,0,.72),
    inset 0 0 20px rgba(0,0,0,.75);
}

/* subdued zipper */

.case:after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:14px;
  border:2px solid rgba(105,108,110,.6);
  pointer-events:none;
}

/* stitching */

.case:before{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:11px;
  border:1px dashed rgba(160,163,165,.36);
  pointer-events:none;
}

/* stacked pages */

.page-stack{
  position:absolute;
  z-index:1;
  top:24px;
  left:25px;
  right:18px;
  bottom:27px;
  border-radius:3px;

  background:#121314;

  box-shadow:
    3px 3px 0 rgba(200,205,205,.13),
    6px 6px 0 rgba(0,0,0,.7),
    8px 8px 0 rgba(180,185,185,.08);
}

#sheetHost{
  position:absolute;
  z-index:5;
  top:20px;
  bottom:30px;
  left:18px;
  right:18px;
}

.sheet{
  position:absolute;
  inset:0;
  transform-origin:50% 92%;
  will-change:transform,opacity;
  touch-action:none;
  user-select:none;
}

/* PLASTIC PAGE */

.plastic{
  position:absolute;
  inset:0;

  padding:5px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));

  gap:4px;

  border-radius:3px;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.018) 21%,
      rgba(255,255,255,.015) 48%,
      rgba(255,255,255,.065) 68%,
      rgba(255,255,255,.015)
    ),
    rgba(190,200,202,.045);

  border:1px solid rgba(220,225,225,.28);

  box-shadow:
    0 3px 7px rgba(0,0,0,.72),
    inset 0 0 10px rgba(255,255,255,.04);
}

/* center binding seam */

.plastic:before{
  content:"";
  position:absolute;
  z-index:5;
  top:0;
  bottom:0;
  left:50%;
  width:2px;

  background:
    linear-gradient(
      to right,
      rgba(255,255,255,.17),
      rgba(0,0,0,.22)
    );

  pointer-events:none;
}

/* clear plastic reflection */

.plastic:after{
  content:"";
  position:absolute;
  z-index:8;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      118deg,
      rgba(255,255,255,.07) 0%,
      rgba(255,255,255,.015) 17%,
      transparent 28%,
      transparent 67%,
      rgba(255,255,255,.035) 79%,
      transparent 100%
    );
}

/* POCKET */

.album{
  position:relative;
  min-width:0;
  min-height:0;
  padding:2px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:1px solid rgba(225,230,230,.16);

  background:rgba(255,255,255,.015);

  box-shadow:
    inset 0 0 7px rgba(255,255,255,.025);
}

/* welded pocket seam */

.album:before{
  content:"";
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:0;
  height:4px;

  border-top:1px solid rgba(255,255,255,.18);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.05),
      rgba(255,255,255,.01)
    );

  pointer-events:none;
}

/* sleeve lip */

.album:after{
  content:"";
  position:absolute;
  z-index:6;
  left:1px;
  right:1px;
  top:0;
  height:13%;

  border-bottom:1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.07),
      rgba(255,255,255,.012)
    );

  pointer-events:none;
}

.cover{
  display:block;
  width:100%;
  max-width:100%;
  max-height:100%;
  aspect-ratio:1;
  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      #343638,
      #242627
    );

  box-shadow:
    0 2px 5px rgba(0,0,0,.9);

  pointer-events:none;
}

.cover.loading{
  opacity:.3;
}

/* PAGE COUNTER */

.page-number{
  position:absolute;
  z-index:12;

  left:50%;
  bottom:33px;

  transform:translateX(-50%);

  padding:2px 7px;

  border-radius:8px;

  background:rgba(15,16,17,.72);

  color:#aaa;

  font-size:8px;
  letter-spacing:.12em;

  pointer-events:none;
}

/* TOOLBAR */

.toolbar{
  flex:0 0 calc(
    var(--toolbar) +
    env(safe-area-inset-bottom)
  );

  height:calc(
    var(--toolbar) +
    env(safe-area-inset-bottom)
  );

  padding:
    5px
    3px
    env(safe-area-inset-bottom);

  display:flex;

  background:#171819;

  border-top:1px solid #393b3d;

  z-index:30;
}

.tool{
  flex:1;
  min-width:0;

  border:0;
  background:none;

  color:#d8d8d8;

  padding:2px;

  font-size:9px;
  letter-spacing:.03em;
  text-transform:uppercase;
}

.icon{
  position:relative;
  display:block;
  width:22px;
  height:25px;
  margin:auto;
  color:#ddd;
}

/* RANDOM */

.icon-random:before{
  content:"";
  position:absolute;
  left:7px;
  top:3px;

  width:7px;
  height:14px;

  border-left:2px solid currentColor;

  transform:
    skew(-18deg)
    rotate(12deg);
}

.icon-random:after{
  content:"";
  position:absolute;
  left:8px;
  bottom:3px;

  width:6px;
  height:6px;

  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;

  transform:rotate(42deg);
}

/* FILTER */

.icon-filter:before{
  content:"";
  position:absolute;

  left:4px;
  top:5px;

  width:14px;
  height:2px;

  background:currentColor;

  box-shadow:
    0 5px 0 currentColor,
    0 10px 0 currentColor;
}

/* SORT */

.icon-sort:before{
  content:"↕";
  position:absolute;
  inset:0;

  font-family:Arial,sans-serif;
  font-size:23px;
  line-height:24px;

  text-align:center;

  color:#ddd;
}

/* SEARCH */

.icon-search:before{
  content:"";
  position:absolute;

  width:8px;
  height:8px;

  left:5px;
  top:5px;

  border:2px solid currentColor;
  border-radius:50%;
}

.icon-search:after{
  content:"";
  position:absolute;

  width:7px;
  height:2px;

  left:12px;
  top:14px;

  background:currentColor;

  transform:rotate(-45deg);
  transform-origin:left center;
}

/* ADD */

.icon-add:before,
.icon-add:after{
  content:"";
  position:absolute;

  left:4px;
  top:11px;

  width:14px;
  height:2px;

  background:currentColor;
}

.icon-add:after{
  transform:rotate(90deg);
}

/* PANELS */

.panel{
  display:none;

  position:fixed;
  z-index:100;

  inset:0;

  padding:
    22px
    18px
    calc(30px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:#1b1c1df8;
}

.panel.open{
  display:block;
}

.panel h2{
  margin:20px 0;
  font-size:21px;
}

.close{
  position:absolute;
  right:14px;
  top:8px;

  border:0;
  background:none;

  color:#fff;
  font-size:32px;
}

.option{
  width:100%;

  padding:15px 2px;

  text-align:left;

  border:0;
  border-bottom:1px solid #3e4042;

  background:none;
  color:#eee;

  font-size:15px;
}

.option.active{
  font-weight:700;
}

.section{
  margin:22px 0 5px;

  color:#8f9294;

  font-size:10px;

  text-transform:uppercase;
  letter-spacing:.12em;
}

input{
  width:100%;

  padding:14px;

  border:1px solid #484a4c;
  border-radius:7px;

  background:#292b2d;
  color:#fff;

  font-size:16px;
}

.empty{
  grid-column:1/3;
  grid-row:1/4;

  align-self:center;

  text-align:center;
  color:#888;
}

@media(max-height:700px){

  :root{
    --header:43px;
    --toolbar:58px;
  }

  header{
    padding-top:8px;
  }

  #sheetHost{
    top:18px;
    bottom:27px;
  }

  .page-stack{
    top:22px;
    bottom:24px;
  }

  .page-number{
    bottom:30px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MY CD WALLET</h1>
  <div id="count"></div>
</header>

<main class="stage">

  <div class="case">

    <div class="page-stack"></div>

    <div id="sheetHost"></div>

    <div
      class="page-number"
      id="pageNumber">
    </div>

  </div>

</main>

<nav class="toolbar">

  <button
    class="tool"
    onclick="randomAlbum()">

    <span class="icon icon-random"></span>
    Random

  </button>

  <button
    class="tool"
    onclick="openPanel('filter')">

    <span class="icon icon-filter"></span>
    Filter

  </button>

  <button
    class="tool"
    onclick="openPanel('sort')">

    <span class="icon icon-sort"></span>
    Sort

  </button>

  <button
    class="tool"
    onclick="openPanel('search')">

    <span class="icon icon-search"></span>
    Search

  </button>

  <button
    class="tool"
    onclick="openPanel('add')">

    <span class="icon icon-add"></span>
    Add

  </button>

</nav>

<!-- SORT -->

<div
  class="panel"
  id="sort">

  <button
    class="close"
    onclick="closePanels()">
    ×
  </button>

  <h2>Sort</h2>

  <button
    class="option"
    onclick="setSort('az')">
    Artist A–Z
  </button>

  <button
    class="option"
    onclick="setSort('za')">
    Artist Z–A
  </button>

  <button
    class="option"
    onclick="setSort('old')">
    Release date — oldest first
  </button>

  <button
    class="option"
    onclick="setSort('new')">
    Release date — newest first
  </button>

  <button
    class="option"
    onclick="setSort('historicOld')">
    Historic — oldest first
  </button>

  <button
    class="option"
    onclick="setSort('historicNew')">
    Historic — newest first
  </button>

</div>

<!-- SEARCH -->

<div
  class="panel"
  id="search">

  <button
    class="close"
    onclick="closePanels()">
    ×
  </button>

  <h2>Search</h2>

  <input
    id="searchBox"
    placeholder="Artist or album"
    oninput="page=0;render()">

</div>

<!-- FILTER -->

<div
  class="panel"
  id="filter">

  <button
    class="close"
    onclick="closePanels()">
    ×
  </button>

  <h2>Filter</h2>

  <div id="filters"></div>

</div>

<!-- ADD -->

<div
  class="panel"
  id="add">

  <button
    class="close"
    onclick="closePanels()">
    ×
  </button>

  <h2>Add Album</h2>

  <p style="color:#aaa">
    Album search/add comes next.
  </p>

</div>

<script>

/*
The last number on each album is its
temporary HISTORIC order.

Later we'll replace these with your
actual acquisition order.
*/

const rawAlbums=[

["The Strokes","Is This It",2001,"Rock",["Energetic","Cool"],1],

["Sade","Lovers Rock",2000,"R&B",["Romantic","Late Night"],2],

["Weezer","Weezer (Blue Album)",1994,"Rock",["Energetic","Nostalgic"],3],

["Green Day","Dookie",1994,"Punk",["Energetic","Fun"],4],

["Cannonball Adderley","Somethin' Else",1958,"Jazz",["Cool","Late Night"],5],

["Grateful Dead","Workingman's Dead",1970,"Rock",["Laid Back","Road Trip"],6],

["Erykah Badu","Baduizm",1997,"R&B",["Laid Back","Late Night"],7],

["Digable Planets","Reachin' (A New Refutation of Time and Space)",1993,"Hip-Hop",["Laid Back","Cool"],8],

["De La Soul","Stakes Is High",1996,"Hip-Hop",["Cool","Energetic"],9],

["Arcade Fire","Funeral",2004,"Indie Rock",["Melancholy","Energetic"],10],

["Lana Del Rey","Norman Fucking Rockwell!",2019,"Pop",["Melancholy","Late Night"],11],

["Miles Davis","In a Silent Way",1969,"Jazz",["Cool","Late Night"],12],

["Alice Coltrane","Journey in Satchidananda",1971,"Jazz",["Spiritual","Meditative"],13],

["Zero 7","When It Falls",2004,"Electronic",["Laid Back","Late Night"],14],

["Bon Iver","For Emma, Forever Ago",2007,"Indie Folk",["Melancholy","Quiet"],15],

["Nick Drake","Pink Moon",1972,"Folk",["Melancholy","Quiet"],16],

["Neutral Milk Hotel","In the Aeroplane Over the Sea",1998,"Indie Rock",["Melancholy","Energetic"],17],

["Stevie Wonder","Music of My Mind",1972,"Soul",["Romantic","Laid Back"],18],

["Stevie Wonder","Talking Book",1972,"Soul",["Romantic","Late Night"],19],

["Stevie Wonder","Songs in the Key of Life",1976,"Soul",["Energetic","Joyful"],20],

["Wilco","Yankee Hotel Foxtrot",2002,"Alternative",["Melancholy","Road Trip"],21],

["Frank Sinatra & Antonio Carlos Jobim","Francis Albert Sinatra & Antonio Carlos Jobim",1967,"Jazz",["Romantic","Cool"],22],

["The Postal Service","Give Up",2003,"Electronic",["Melancholy","Energetic"],23],

["The Beatles","Abbey Road",1969,"Rock",["Classic","Laid Back"],24],

["Radiohead","OK Computer",1997,"Alternative",["Melancholy","Energetic"],25],

["Radiohead","Kid A",2000,"Alternative",["Cool","Meditative"],26],

["Radiohead","In Rainbows",2007,"Alternative",["Romantic","Late Night"],27],

["Nina Simone","To Love Somebody",1969,"Soul",["Melancholy","Late Night"],28],

["Sarah Vaughan & Clifford Brown","Sarah Vaughan with Clifford Brown",1954,"Jazz",["Romantic","Cool"],29],

["Kendrick Lamar","good kid, m.A.A.d city",2012,"Hip-Hop",["Energetic","Late Night"],30],

["Peter, Paul & Mary","The Very Best Of",1969,"Folk",["Laid Back","Nostalgic"],31],

["M. Ward","Hold Time",2009,"Indie Folk",["Laid Back","Road Trip"],32],

["April Smith","Songs for a Sinking Ship",2010,"Pop",["Energetic","Romantic"],33],

["Billie Holiday","Solitude",1956,"Jazz",["Melancholy","Late Night"],34],

["O Brother, Where Art Thou?","Original Soundtrack",2000,"Soundtrack",["Nostalgic","Road Trip"],35],

["Ella Fitzgerald & Louis Armstrong","Ella and Louis",1956,"Jazz",["Romantic","Cool"],36]

];


/*
Exact Apple catalog IDs.

These bypass text searching entirely.
We'll continue filling this list until
all 36 albums are locked to exact records.
*/

const exactAppleIDs={

  "The Strokes|Is This It":
  "266376953",

  "Sade|Lovers Rock":
  "193532145",

  "Green Day|Dookie":
  "1160081985",

  "Cannonball Adderley|Somethin' Else":
  "721271258",

  "Grateful Dead|Workingman's Dead":
  "663696329",

  "Erykah Badu|Baduizm":
  "1440837269",

  "Bon Iver|For Emma, Forever Ago":
  "947059824"

};


const albums=
rawAlbums.map(x=>({

  artist:x[0],

  album:x[1],

  year:x[2],

  genre:x[3],

  moods:x[4],

  historic:x[5],

  appleID:
    exactAppleIDs[
      x[0]+"|"+x[1]
    ] || null,

  artwork:null

}));


let page=0;

let sort="az";

let genre=null;
let mood=null;
let decade=null;

let visibleAlbums=[];

let dragging=false;

let startX=0;
let startY=0;

let dx=0;

let ignoreClick=false;

const perPage=6;

const host=
document.getElementById(
  "sheetHost"
);


/* SPOTIFY */

function spotify(a){

  location.href=
    "https://open.spotify.com/search/"+
    encodeURIComponent(
      a.artist+" "+a.album
    );

}


/* NORMALIZE TEXT */

function normalize(s){

  return String(s)
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-z0-9]/g,
      ""
    );

}


/* ARTWORK */

async function resolveArtwork(a){

  if(a.artwork){

    return a.artwork;

  }


  /*
  If an exact Apple ID exists,
  use that exact album.
  */

  if(a.appleID){

    try{

      const response=
        await fetch(

          "https://itunes.apple.com/lookup?id="+
          a.appleID+
          "&entity=album"

        );


      const data=
        await response.json();


      const albumResult=
        data.results.find(
          r=>
            r.wrapperType==="collection" &&
            r.artworkUrl100
        );


      if(albumResult){

        a.artwork=
          albumResult.artworkUrl100

          .replace(
            /100x100bb/,
            "600x600bb"
          )

          .replace(
            /100x100/,
            "600x600"
          );


        return a.artwork;

      }

    }

    catch(error){

      console.log(
        "Exact artwork lookup failed:",
        a.artist,
        a.album
      );

    }

  }


  /*
  Temporary fallback for albums
  that don't yet have exact IDs.
  */

  const searchTerms=[

    a.artist+" "+a.album,

    a.album+" "+a.artist

  ];


  for(
    const term
    of searchTerms
  ){

    try{

      const response=
        await fetch(

          "https://itunes.apple.com/search?term="+
          encodeURIComponent(term)+
          "&entity=album&country=US&limit=25"

        );


      const data=
        await response.json();


      if(
        !data.results ||
        !data.results.length
      ){

        continue;

      }


      const targetArtist=
        normalize(
          a.artist
        );


      const targetAlbum=
        normalize(
          a.album
        );


      let best=null;

      let bestScore=-999;


      for(
        const r
        of data.results
      ){

        const ra=
          normalize(
            r.artistName || ""
          );


        const rt=
          normalize(
            r.collectionName || ""
          );


        let score=0;


        /* artist */

        if(
          ra===targetArtist
        ){

          score+=20;

        }

        else if(
          ra.includes(
            targetArtist
          )
          ||
          targetArtist.includes(
            ra
          )
        ){

          score+=12;

        }


        /* album */

        if(
          rt===targetAlbum
        ){

          score+=25;

        }

        else if(
          rt.includes(
            targetAlbum
          )
          ||
          targetAlbum.includes(
            rt
          )
        ){

          score+=15;

        }


        /* release year */

        if(
          r.releaseDate
        ){

          const resultYear=
            new Date(
              r.releaseDate
            )
            .getFullYear();


          const difference=
            Math.abs(
              resultYear-a.year
            );


          if(
            difference===0
          ){

            score+=6;

          }

          else if(
            difference<=2
          ){

            score+=4;

          }

          else if(
            difference<=5
          ){

            score+=1;

          }

        }


        /* bad-match penalties */

        const title=
          (
            r.collectionName ||
            ""
          )
          .toLowerCase();


        if(
          title.includes(
            "tribute"
          )
        ){

          score-=20;

        }


        if(
          title.includes(
            "karaoke"
          )
        ){

          score-=30;

        }


        if(
          title.includes(
            "instrumental"
          )
        ){

          score-=15;

        }


        if(
          score>bestScore
        ){

          bestScore=score;

          best=r;

        }

      }


      if(
        best &&
        best.artworkUrl100
      ){

        a.artwork=
          best.artworkUrl100

          .replace(
            /100x100bb/,
            "600x600bb"
          )

          .replace(
            /100x100/,
            "600x600"
          );


        return a.artwork;

      }

    }

    catch(error){

      console.log(
        "Artwork search failed:",
        a.artist,
        a.album
      );

    }

  }


  return null;

}


async function loadArtwork(
  a,
  img
){

  const url=
    await resolveArtwork(a);


  if(url){

    img.src=url;

    img.classList.remove(
      "loading"
    );

  }

}


/* FILTER + SORT */

function filtered(){

  const q=
    (
      document
      .getElementById(
        "searchBox"
      )
      .value
      ||
      ""
    )
    .toLowerCase();


  let v=
    albums.filter(
      a=>

      (
        !genre ||
        a.genre===genre
      )

      &&

      (
        !mood ||
        a.moods.includes(
          mood
        )
      )

      &&

      (
        !decade ||
        Math.floor(
          a.year/10
        )*10===decade
      )

      &&

      (
        !q ||

        (
          a.artist+
          " "+
          a.album
        )
        .toLowerCase()
        .includes(
          q
        )

      )

    );


  switch(sort){

    case "az":

      v.sort(
        (a,b)=>
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "za":

      v.sort(
        (a,b)=>
          b.artist.localeCompare(
            a.artist
          )
      );

      break;


    case "old":

      v.sort(
        (a,b)=>
          a.year-b.year
          ||
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "new":

      v.sort(
        (a,b)=>
          b.year-a.year
          ||
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "historicOld":

      v.sort(
        (a,b)=>
          a.historic-b.historic
      );

      break;


    case "historicNew":

      v.sort(
        (a,b)=>
          b.historic-a.historic
      );

      break;

  }


  return v;

}


/* BUILD PAGE */

function makeSheet(items){

  const sheet=
    document.createElement(
      "div"
    );


  sheet.className=
    "sheet";


  const plastic=
    document.createElement(
      "div"
    );


  plastic.className=
    "plastic";


  sheet.appendChild(
    plastic
  );


  if(
    !items.length
  ){

    plastic.innerHTML=
      '<div class="empty">No albums found</div>';


    return sheet;

  }


  items.forEach(
    a=>{

      const pocket=
        document.createElement(
          "div"
        );


      pocket.className=
        "album";


      const img=
        document.createElement(
          "img"
        );


      img.className=
        "cover loading";


      img.alt=
        a.artist+
        " — "+
        a.album;


      pocket.appendChild(
        img
      );


      pocket.addEventListener(
        "click",
        ()=>{

          if(
            !ignoreClick
          ){

            spotify(a);

          }

        }
      );


      plastic.appendChild(
        pocket
      );


      loadArtwork(
        a,
        img
      );

    }
  );


  return sheet;

}


/* RENDER */

function render(){

  visibleAlbums=
    filtered();


  const totalPages=
    Math.max(
      1,
      Math.ceil(
        visibleAlbums.length /
        perPage
      )
    );


  if(
    page>=totalPages
  ){

    page=
      totalPages-1;

  }


  host.innerHTML=
    "";


  const start=
    page*perPage;


  const sheet=
    makeSheet(

      visibleAlbums.slice(
        start,
        start+perPage
      )

    );


  host.appendChild(
    sheet
  );


  document
    .getElementById(
      "count"
    )
    .textContent=

      visibleAlbums.length+
      " ALBUMS";


  document
    .getElementById(
      "pageNumber"
    )
    .textContent=

      (page+1)+
      " / "+
      totalPages;


  bindSwipe(
    sheet
  );

}


/* SWIPE */

function bindSwipe(sheet){

  sheet.addEventListener(
    "pointerdown",
    e=>{

      dragging=true;

      startX=
        e.clientX;

      startY=
        e.clientY;

      dx=0;

      ignoreClick=false;


      sheet.setPointerCapture(
        e.pointerId
      );


      sheet.style.transition=
        "none";

    }
  );


  sheet.addEventListener(
    "pointermove",
    e=>{

      if(
        !dragging
      ){

        return;

      }


      dx=
        e.clientX-startX;


      const dy=
        e.clientY-startY;


      if(
        Math.abs(dx)>8
      ){

        ignoreClick=true;

      }


      if(
        Math.abs(dx)>
        Math.abs(dy)
      ){

        e.preventDefault();


        const rotation=
          dx/30;


        const lift=
          Math.min(
            9,
            Math.abs(dx)/20
          );


        sheet.style.transform=

          `translate3d(
            ${dx}px,
            -${lift}px,
            0
          )
          rotate(
            ${rotation}deg
          )`;

      }

    }
  );


  sheet.addEventListener(
    "pointerup",
    ()=>{

      if(
        !dragging
      ){

        return;

      }


      dragging=false;


      const threshold=
        Math.min(
          90,
          window.innerWidth*.2
        );


      if(
        Math.abs(dx)>
        threshold
      ){

        turn(
          dx<0 ? 1 : -1,
          sheet
        );

      }

      else{

        snapBack(
          sheet
        );

      }

    }
  );


  sheet.addEventListener(
    "pointercancel",
    ()=>{

      dragging=false;

      snapBack(
        sheet
      );

    }
  );

}


function snapBack(sheet){

  sheet.style.transition=
    "transform .18s cubic-bezier(.2,.8,.2,1)";


  sheet.style.transform=
    "translate3d(0,0,0) rotate(0deg)";


  setTimeout(
    ()=>{

      ignoreClick=false;

    },
    210
  );

}


function turn(
  direction,
  sheet
){

  const totalPages=
    Math.ceil(
      visibleAlbums.length /
      perPage
    );


  const atEnd=
    direction===1 &&
    page>=totalPages-1;


  const atStart=
    direction===-1 &&
    page<=0;


  if(
    atEnd ||
    atStart
  ){

    snapBack(
      sheet
    );

    return;

  }


  sheet.style.transition=
    "transform .24s ease-in, opacity .2s ease-in";


  sheet.style.opacity=
    ".15";


  sheet.style.transform=

    `translate3d(
      ${direction===1 ? "-125vw" : "125vw"},
      -14px,
      0
    )
    rotate(
      ${direction===1 ? "-12deg" : "12deg"}
    )`;


  setTimeout(
    ()=>{

      page+=direction;

      render();


      const next=
        host.firstChild;


      next.style.transition=
        "none";


      next.style.transform=

        `translate3d(
          ${direction===1 ? "20px" : "-20px"},
          0,
          0
        )
        rotate(
          ${direction===1 ? "1.3deg" : "-1.3deg"}
        )`;


      requestAnimationFrame(
        ()=>{

          requestAnimationFrame(
            ()=>{

              next.style.transition=
                "transform .16s ease-out";


              next.style.transform=
                "translate3d(0,0,0) rotate(0deg)";

            }
          );

        }
      );


      setTimeout(
        ()=>{

          ignoreClick=false;

        },
        200
      );

    },
    220
  );

}


/* RANDOM */

function randomAlbum(){

  visibleAlbums=
    filtered();


  if(
    !visibleAlbums.length
  ){

    return;

  }


  const a=
    visibleAlbums[
      Math.floor(
        Math.random()*
        visibleAlbums.length
      )
    ];


  spotify(a);

}


/* PANELS */

function openPanel(id){

  closePanels();


  document
    .getElementById(
      id
    )
    .classList.add(
      "open"
    );

}


function closePanels(){

  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      p=>
        p.classList.remove(
          "open"
        )
    );

}


function setSort(value){

  sort=value;

  page=0;

  closePanels();

  render();

}


/* FILTER MENU */

function addFilter(
  label,
  fn,
  active
){

  const button=
    document.createElement(
      "button"
    );


  button.className=
    "option"+
    (
      active
      ?
      " active"
      :
      ""
    );


  button.textContent=
    label;


  button.onclick=
    fn;


  document
    .getElementById(
      "filters"
    )
    .appendChild(
      button
    );

}


function buildFilters(){

  const f=
    document.getElementById(
      "filters"
    );


  /* GENRE */

  f.innerHTML=
    '<div class="section">Genre</div>';


  addFilter(
    "All genres",
    ()=>{

      genre=null;
      page=0;

      buildFilters();
      render();

    },
    !genre
  );


  [
    ...new Set(
      albums.map(
        a=>a.genre
      )
    )
  ]
  .sort()
  .forEach(
    g=>

      addFilter(
        g,
        ()=>{

          genre=g;
          page=0;

          buildFilters();
          render();

        },
        genre===g
      )

  );


  /* MOOD */

  f.insertAdjacentHTML(
    "beforeend",
    '<div class="section">Mood</div>'
  );


  addFilter(
    "All moods",
    ()=>{

      mood=null;
      page=0;

      buildFilters();
      render();

    },
    !mood
  );


  [
    ...new Set(
      albums.flatMap(
        a=>a.moods
      )
    )
  ]
  .sort()
  .forEach(
    m=>

      addFilter(
        m,
        ()=>{

          mood=m;
          page=0;

          buildFilters();
          render();

        },
        mood===m
      )

  );


  /* DECADE */

  f.insertAdjacentHTML(
    "beforeend",
    '<div class="section">Decade</div>'
  );


  addFilter(
    "All decades",
    ()=>{

      decade=null;
      page=0;

      buildFilters();
      render();

    },
    !decade
  );


  [
    ...new Set(
      albums.map(
        a=>
          Math.floor(
            a.year/10
          )*10
      )
    )
  ]
  .sort(
    (a,b)=>a-b
  )
  .forEach(
    d=>

      addFilter(
        d+"s",
        ()=>{

          decade=d;
          page=0;

          buildFilters();
          render();

        },
        decade===d
      )

  );

}


buildFilters();

render();

</script>
