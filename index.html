<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141516">
<title>My CD Wallet</title>

<style>
:root{
  --header:50px;
  --toolbar:64px;
  --bg:#141516;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:var(--header);
  flex:0 0 var(--header);
  padding:12px 15px 6px;
  display:flex;
  align-items:end;
  justify-content:space-between;
}

h1{
  margin:0;
  font-size:14px;
  letter-spacing:.14em;
  font-weight:650;
}

#count{
  font-size:10px;
  color:#929598;
  letter-spacing:.1em;
}

/* WALLET AREA */

.stage{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  padding:2px 8px 6px;
  display:flex;
  justify-content:center;
  align-items:stretch;
}

.case{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  min-height:0;
  border-radius:20px;

  /* woven black nylon */
  background:
    radial-gradient(
      ellipse at 25% 15%,
      rgba(255,255,255,.055),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 80% 75%,
      rgba(0,0,0,.45),
      transparent 50%
    ),
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      rgba(0,0,0,.04) 1px,
      rgba(0,0,0,.04) 3px
    ),
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.012) 0px,
      rgba(255,255,255,.012) 1px,
      rgba(0,0,0,.025) 1px,
      rgba(0,0,0,.025) 3px
    ),
    #202223;

  border:2px solid #080909;

  box-shadow:
    0 7px 18px rgba(0,0,0,.7),
    inset 0 0 0 2px #3a3c3e,
    inset 0 0 25px rgba(0,0,0,.8);
}

/* zipper */

.case:after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:15px;
  border:3px double #676a6c;
  opacity:.7;
  pointer-events:none;
}

/* stitching */

.case:before{
  content:"";
  position:absolute;
  inset:11px;
  border-radius:12px;
  border:2px dashed rgba(155,158,160,.38);
  pointer-events:none;
}

.brand{
  position:absolute;
  z-index:10;
  top:13px;
  left:27px;
  font-size:7px;
  letter-spacing:.18em;
  color:#949799;
  text-shadow:0 1px 1px #000;
}

/* stacked pages behind current page */

.page-stack{
  position:absolute;
  z-index:1;
  top:35px;
  left:27px;
  right:20px;
  bottom:24px;
  border-radius:4px;

  background:#151617;

  box-shadow:
    3px 3px 0 rgba(190,195,195,.15),
    6px 6px 0 #111,
    8px 8px 0 rgba(190,195,195,.1);
}

/* ACTIVE PLASTIC PAGE */

#sheetHost{
  position:absolute;
  z-index:5;
  top:31px;
  bottom:27px;
  left:20px;
  right:20px;
}

.sheet{
  position:absolute;
  inset:0;
  transform-origin:50% 92%;
  will-change:transform,opacity;
  touch-action:none;
  user-select:none;
}

.plastic{
  position:absolute;
  inset:0;

  padding:8px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));

  gap:7px;

  border-radius:3px;

  background:
    linear-gradient(
      112deg,
      rgba(255,255,255,.11) 0%,
      rgba(255,255,255,.025) 18%,
      rgba(255,255,255,.02) 45%,
      rgba(255,255,255,.075) 63%,
      rgba(255,255,255,.018) 82%
    ),
    rgba(190,200,202,.065);

  border:1px solid rgba(225,230,230,.32);

  box-shadow:
    0 3px 8px rgba(0,0,0,.7),
    inset 0 0 13px rgba(255,255,255,.055);
}

/* vertical sleeve seam */

.plastic:before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  border-left:1px solid rgba(255,255,255,.18);
  border-right:1px solid rgba(0,0,0,.2);
  pointer-events:none;
}

/* faint overall plastic reflection */

.plastic:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.07),
      transparent 18%,
      transparent 70%,
      rgba(255,255,255,.025)
    );
}

/* EACH CD POCKET */

.album{
  position:relative;
  min-width:0;
  min-height:0;
  padding:5px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:
    1px solid rgba(225,230,230,.19);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.035),
      rgba(0,0,0,.04)
    );

  box-shadow:
    inset 0 0 7px rgba(255,255,255,.025);
}

/* pocket bottom seam */

.album:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  border-bottom:1px solid rgba(255,255,255,.16);
  pointer-events:none;
}

/* clear sleeve reflection */

.album:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.11),
      transparent 23%,
      transparent 68%,
      rgba(255,255,255,.025)
    );
}

.cover{
  display:block;

  /* square regardless of pocket dimensions */
  width:min(100%,100cqh);
  max-width:100%;
  max-height:100%;
  aspect-ratio:1 / 1;

  object-fit:cover;

  background:
    linear-gradient(135deg,#343638,#242627);

  box-shadow:
    0 2px 5px rgba(0,0,0,.85);

  pointer-events:none;
}

/* loading indicator */

.cover.loading{
  opacity:.45;
}

.page-number{
  position:absolute;
  z-index:10;
  bottom:9px;
  left:0;
  right:0;

  text-align:center;

  font-size:8px;
  letter-spacing:.12em;
  color:#747779;
}

/* BOTTOM TOOLBAR */

.toolbar{
  flex:0 0 calc(var(--toolbar) + env(safe-area-inset-bottom));

  height:calc(var(--toolbar) + env(safe-area-inset-bottom));

  padding:
    5px
    3px
    env(safe-area-inset-bottom);

  display:flex;

  background:#171819;

  border-top:1px solid #393b3d;

  z-index:30;
}

.tool{
  flex:1;
  min-width:0;

  border:0;
  background:none;
  color:#d8d8d8;

  padding:2px;

  font-size:9px;
  letter-spacing:.03em;
  text-transform:uppercase;
}

.tool b{
  display:block;
  height:26px;
  line-height:25px;

  font-size:19px;
  font-weight:400;
}

/* PANELS */

.panel{
  display:none;

  position:fixed;
  z-index:100;

  inset:0;

  padding:
    22px
    18px
    calc(30px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:#1b1c1df8;
}

.panel.open{
  display:block;
}

.panel h2{
  margin:20px 0;
  font-size:21px;
}

.close{
  position:absolute;
  right:14px;
  top:8px;

  border:0;
  background:none;
  color:#fff;

  font-size:32px;
}

.option{
  width:100%;

  padding:15px 2px;

  text-align:left;

  border:0;
  border-bottom:1px solid #3e4042;

  background:none;
  color:#eee;

  font-size:15px;
}

.option.active{
  font-weight:700;
}

.section{
  margin:22px 0 5px;

  color:#8f9294;

  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
}

input{
  width:100%;

  padding:14px;

  border:1px solid #484a4c;
  border-radius:7px;

  background:#292b2d;
  color:#fff;

  font-size:16px;
}

.empty{
  grid-column:1 / 3;
  grid-row:1 / 4;

  align-self:center;

  text-align:center;
  color:#888;
}

/* small phones */

@media(max-height:700px){

  :root{
    --header:43px;
    --toolbar:58px;
  }

  header{
    padding-top:8px;
  }

  #sheetHost{
    top:28px;
    bottom:23px;
  }

  .page-stack{
    top:31px;
    bottom:21px;
  }

  .plastic{
    gap:5px;
    padding:6px;
  }

  .album{
    padding:4px;
  }

  .brand{
    top:10px;
  }

}
</style>
</head>

<body>

<header>

<h1>MY CD WALLET</h1>

<div id="count"></div>

</header>


<main class="stage">

<div class="case">

<div class="brand">
COMPACT DISC WALLET
</div>

<div class="page-stack"></div>

<div id="sheetHost"></div>

<div
class="page-number"
id="pageNumber">
</div>

</div>

</main>


<nav class="toolbar">

<button
class="tool"
onclick="randomAlbum()">
<b>↯</b>
Random
</button>

<button
class="tool"
onclick="openPanel('filter')">
<b>≡</b>
Filter
</button>

<button
class="tool"
onclick="openPanel('sort')">
<b>↕</b>
Sort
</button>

<button
class="tool"
onclick="openPanel('search')">
<b>⌕</b>
Search
</button>

<button
class="tool"
onclick="openPanel('add')">
<b>＋</b>
Add
</button>

</nav>


<div
class="panel"
id="sort">

<button
class="close"
onclick="closePanels()">
×
</button>

<h2>Sort</h2>

<button
class="option"
onclick="setSort('az')">
Artist A–Z
</button>

<button
class="option"
onclick="setSort('za')">
Artist Z–A
</button>

<button
class="option"
onclick="setSort('old')">
Release date — oldest first
</button>

<button
class="option"
onclick="setSort('new')">
Release date — newest first
</button>

</div>


<div
class="panel"
id="search">

<button
class="close"
onclick="closePanels()">
×
</button>

<h2>Search</h2>

<input
id="searchBox"
placeholder="Artist or album"
oninput="page=0;render()">

</div>


<div
class="panel"
id="filter">

<button
class="close"
onclick="closePanels()">
×
</button>

<h2>Filter</h2>

<div id="filters"></div>

</div>


<div
class="panel"
id="add">

<button
class="close"
onclick="closePanels()">
×
</button>

<h2>Add Album</h2>

<p style="color:#aaa">
Album search/add comes next.
</p>

</div>


<script>

const albums=[

["Alice Coltrane","Journey in Satchidananda",1971,"Jazz",["Spiritual","Meditative"]],

["April Smith","Songs for a Sinking Ship",2010,"Pop",["Energetic","Romantic"]],

["Arcade Fire","Funeral",2004,"Indie Rock",["Melancholy","Energetic"]],

["The Beatles","Abbey Road",1969,"Rock",["Classic","Laid Back"]],

["Erykah Badu","Baduizm",1997,"R&B",["Laid Back","Late Night"]],

["Bon Iver","For Emma, Forever Ago",2007,"Indie Folk",["Melancholy","Quiet"]],

["Cannonball Adderley","Somethin' Else",1958,"Jazz",["Cool","Late Night"]],

["De La Soul","Stakes Is High",1996,"Hip-Hop",["Cool","Energetic"]],

["Digable Planets","Reachin' (A New Refutation of Time and Space)",1993,"Hip-Hop",["Laid Back","Cool"]],

["Miles Davis","In a Silent Way",1969,"Jazz",["Cool","Late Night"]],

["Lana Del Rey","Norman Fucking Rockwell!",2019,"Pop",["Melancholy","Late Night"]],

["Ella Fitzgerald & Louis Armstrong","Ella and Louis",1956,"Jazz",["Romantic","Cool"]],

["Grateful Dead","Workingman's Dead",1970,"Rock",["Laid Back","Road Trip"]],

["Green Day","Dookie",1994,"Punk",["Energetic","Fun"]],

["Billie Holiday","Solitude",1956,"Jazz",["Melancholy","Late Night"]],

["Kendrick Lamar","good kid, m.A.A.d city",2012,"Hip-Hop",["Energetic","Late Night"]],

["Neutral Milk Hotel","In the Aeroplane Over the Sea",1998,"Indie Rock",["Melancholy","Energetic"]],

["Nick Drake","Pink Moon",1972,"Folk",["Melancholy","Quiet"]],

["O Brother, Where Art Thou?","Original Soundtrack",2000,"Soundtrack",["Nostalgic","Road Trip"]],

["Peter, Paul & Mary","The Very Best Of",1969,"Folk",["Laid Back","Nostalgic"]],

["The Postal Service","Give Up",2003,"Electronic",["Melancholy","Energetic"]],

["Radiohead","OK Computer",1997,"Alternative",["Melancholy","Energetic"]],

["Radiohead","Kid A",2000,"Alternative",["Cool","Meditative"]],

["Radiohead","In Rainbows",2007,"Alternative",["Romantic","Late Night"]],

["Sade","Lovers Rock",2000,"R&B",["Romantic","Late Night"]],

["Frank Sinatra & Antonio Carlos Jobim","Francis Albert Sinatra & Antonio Carlos Jobim",1967,"Jazz",["Romantic","Cool"]],

["Nina Simone","To Love Somebody",1969,"Soul",["Melancholy","Late Night"]],

["The Strokes","Is This It",2001,"Rock",["Energetic","Cool"]],

["Sarah Vaughan & Clifford Brown","Sarah Vaughan with Clifford Brown",1954,"Jazz",["Romantic","Cool"]],

["Stevie Wonder","Music of My Mind",1972,"Soul",["Romantic","Laid Back"]],

["Stevie Wonder","Talking Book",1972,"Soul",["Romantic","Late Night"]],

["Stevie Wonder","Songs in the Key of Life",1976,"Soul",["Energetic","Joyful"]],

["M. Ward","Hold Time",2009,"Indie Folk",["Laid Back","Road Trip"]],

["Weezer","Weezer (Blue Album)",1994,"Rock",["Energetic","Nostalgic"]],

["Wilco","Yankee Hotel Foxtrot",2002,"Alternative",["Melancholy","Road Trip"]],

["Zero 7","When It Falls",2004,"Electronic",["Laid Back","Late Night"]]

].map(x=>({

artist:x[0],
album:x[1],
year:x[2],
genre:x[3],
moods:x[4]

}));


let page=0;
let sort="az";

let genre=null;
let mood=null;
let decade=null;

let visibleAlbums=[];

let dragging=false;
let startX=0;
let startY=0;
let dx=0;

let ignoreClick=false;

const perPage=6;

const host=
document.getElementById("sheetHost");


function normalize(s){

return s
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}


function spotify(a){

location.href=
"https://open.spotify.com/search/"+
encodeURIComponent(
a.artist+" "+a.album
);

}


/*
Better artwork matching:

Instead of taking the first iTunes result,
we inspect several results and choose the
closest artist/title match.
*/

async function artwork(a,img){

const query=
encodeURIComponent(
a.artist+" "+a.album
);

try{

const response=
await fetch(
"https://itunes.apple.com/search?term="+
query+
"&entity=album&limit=15"
);

const data=
await response.json();

if(
!data.results ||
!data.results.length
){
return;
}


const targetArtist=
normalize(a.artist);

const targetAlbum=
normalize(a.album);


let best=null;
let bestScore=-1;


for(
const result
of data.results
){

const ra=
normalize(
result.artistName || ""
);

const rt=
normalize(
result.collectionName || ""
);


let score=0;


if(
ra===targetArtist
){
score+=10;
}

else if(
ra.includes(targetArtist) ||
targetArtist.includes(ra)
){
score+=6;
}


if(
rt===targetAlbum
){
score+=12;
}

else if(
rt.includes(targetAlbum) ||
targetAlbum.includes(rt)
){
score+=7;
}


/*
Slight preference for releases near
the expected original year.
*/

if(
result.releaseDate
){

const y=
new Date(
result.releaseDate
).getFullYear();

const difference=
Math.abs(
y-a.year
);

if(
difference===0
){
score+=3;
}

else if(
difference<=2
){
score+=2;
}

}


if(
score>bestScore
){

bestScore=score;
best=result;

}

}


if(
best &&
best.artworkUrl100
){

img.src=
best.artworkUrl100
.replace(
"100x100bb",
"600x600bb"
)
.replace(
"100x100",
"600x600"
);

img.classList.remove(
"loading"
);

}

}

catch(error){

console.log(
"Artwork error:",
a.artist,
a.album
);

}

}


function filtered(){

const q=
(
document
.getElementById("searchBox")
.value
||
""
)
.toLowerCase();


let v=
albums.filter(a=>

(!genre ||
a.genre===genre)

&&

(!mood ||
a.moods.includes(mood))

&&

(!decade ||
Math.floor(a.year/10)*10===decade)

&&

(
!q ||

(
a.artist+
" "+
a.album
)
.toLowerCase()
.includes(q)

)

);


if(
sort==="az"
){

v.sort(
(a,b)=>
a.artist.localeCompare(
b.artist
)
);

}


if(
sort==="za"
){

v.sort(
(a,b)=>
b.artist.localeCompare(
a.artist
)
);

}


if(
sort==="old"
){

v.sort(
(a,b)=>
a.year-b.year
||
a.artist.localeCompare(
b.artist
)
);

}


if(
sort==="new"
){

v.sort(
(a,b)=>
b.year-a.year
||
a.artist.localeCompare(
b.artist
)
);

}


return v;

}


function makeSheet(items){

const sheet=
document.createElement("div");

sheet.className="sheet";


const plastic=
document.createElement("div");

plastic.className="plastic";

sheet.appendChild(
plastic
);


if(
!items.length
){

plastic.innerHTML=
'<div class="empty">No albums found</div>';

return sheet;

}


items.forEach(a=>{

const pocket=
document.createElement("div");

pocket.className=
"album";


const img=
document.createElement("img");

img.className=
"cover loading";

img.alt=
a.artist+
" — "+
a.album;


pocket.appendChild(
img
);


pocket.addEventListener(
"click",
()=>{

if(
!ignoreClick
){

spotify(a);

}

}
);


plastic.appendChild(
pocket
);


artwork(
a,
img
);

});


return sheet;

}


function render(){

visibleAlbums=
filtered();


const totalPages=
Math.max(
1,
Math.ceil(
visibleAlbums.length /
perPage
)
);


if(
page>=totalPages
){

page=
totalPages-1;

}


host.innerHTML="";


const start=
page*perPage;


const items=
visibleAlbums.slice(
start,
start+perPage
);


const sheet=
makeSheet(items);


host.appendChild(
sheet
);


document
.getElementById("count")
.textContent=
visibleAlbums.length+
" ALBUMS";


document
.getElementById("pageNumber")
.textContent=
"PAGE "+
(page+1)+
" / "+
totalPages;


bindSwipe(
sheet
);

}


function bindSwipe(sheet){

sheet.addEventListener(
"pointerdown",
e=>{

dragging=true;

startX=
e.clientX;

startY=
e.clientY;

dx=0;

ignoreClick=false;

sheet.setPointerCapture(
e.pointerId
);

sheet.style.transition=
"none";

}
);


sheet.addEventListener(
"pointermove",
e=>{

if(
!dragging
){
return;
}


dx=
e.clientX-startX;


const dy=
e.clientY-startY;


if(
Math.abs(dx)>8
){

ignoreClick=true;

}


if(
Math.abs(dx)>
Math.abs(dy)
){

e.preventDefault();


const rotation=
dx/28;


const lift=
Math.min(
10,
Math.abs(dx)/18
);


sheet.style.transform=
`translate3d(${dx}px,-${lift}px,0)
 rotate(${rotation}deg)`;

}

}
);


sheet.addEventListener(
"pointerup",
()=>{

if(
!dragging
){
return;
}


dragging=false;


const threshold=
Math.min(
90,
window.innerWidth*.2
);


if(
Math.abs(dx)>
threshold
){

turn(
dx<0 ? 1 : -1,
sheet
);

}

else{

snapBack(
sheet
);

}

}
);


sheet.addEventListener(
"pointercancel",
()=>{

dragging=false;

snapBack(
sheet
);

}
);

}


function snapBack(sheet){

sheet.style.transition=
"transform .18s cubic-bezier(.2,.8,.2,1)";


sheet.style.transform=
"translate3d(0,0,0) rotate(0deg)";


setTimeout(
()=>{

ignoreClick=false;

},
210
);

}


function turn(
direction,
sheet
){

const totalPages=
Math.ceil(
visibleAlbums.length /
perPage
);


const atEnd=
direction===1 &&
page>=totalPages-1;


const atStart=
direction===-1 &&
page<=0;


if(
atEnd ||
atStart
){

snapBack(
sheet
);

return;

}


sheet.style.transition=
"transform .24s ease-in, opacity .2s ease-in";


sheet.style.opacity=
".15";


sheet.style.transform=
`
translate3d(
${direction===1 ? "-125vw" : "125vw"},
-15px,
0
)
rotate(
${direction===1 ? "-13deg" : "13deg"}
)
`;


setTimeout(
()=>{

page+=direction;

render();


const next=
host.firstChild;


next.style.transition=
"none";


next.style.transform=
`
translate3d(
${direction===1 ? "22px" : "-22px"},
0,
0
)
rotate(
${direction===1 ? "1.5deg" : "-1.5deg"}
)
`;


requestAnimationFrame(
()=>{

requestAnimationFrame(
()=>{

next.style.transition=
"transform .16s ease-out";


next.style.transform=
"translate3d(0,0,0) rotate(0deg)";

}
);

}
);


setTimeout(
()=>{

ignoreClick=false;

},
200
);

},
220
);

}


function randomAlbum(){

visibleAlbums=
filtered();


if(
!visibleAlbums.length
){
return;
}


const a=
visibleAlbums[
Math.floor(
Math.random()*
visibleAlbums.length
)
];


spotify(a);

}


function openPanel(id){

closePanels();


document
.getElementById(id)
.classList.add(
"open"
);

}


function closePanels(){

document
.querySelectorAll(
".panel"
)
.forEach(
p=>
p.classList.remove(
"open"
)
);

}


function setSort(value){

sort=value;

page=0;

closePanels();

render();

}


function addFilter(
label,
fn,
active
){

const button=
document.createElement(
"button"
);


button.className=
"option"+
(
active
?
" active"
:
""
);


button.textContent=
label;


button.onclick=
fn;


document
.getElementById(
"filters"
)
.appendChild(
button
);

}


function buildFilters(){

const f=
document.getElementById(
"filters"
);


f.innerHTML=
'<div class="section">Genre</div>';


addFilter(
"All genres",
()=>{

genre=null;
page=0;

buildFilters();
render();

},
!genre
);


[
...new Set(
albums.map(
a=>a.genre
)
)
]
.sort()
.forEach(
g=>

addFilter(
g,
()=>{

genre=g;
page=0;

buildFilters();
render();

},
genre===g
)

);


/* MOOD */

f.insertAdjacentHTML(
"beforeend",
'<div class="section">Mood</div>'
);


addFilter(
"All moods",
()=>{

mood=null;
page=0;

buildFilters();
render();

},
!mood
);


[
...new Set(
albums.flatMap(
a=>a.moods
)
)
]
.sort()
.forEach(
m=>

addFilter(
m,
()=>{

mood=m;
page=0;

buildFilters();
render();

},
mood===m
)

);


/* DECADE */

f.insertAdjacentHTML(
"beforeend",
'<div class="section">Decade</div>'
);


addFilter(
"All decades",
()=>{

decade=null;
page=0;

buildFilters();
render();

},
!decade
);


[
...new Set(
albums.map(
a=>
Math.floor(
a.year/10
)*10
)
)
]
.sort(
(a,b)=>a-b
)
.forEach(
d=>

addFilter(
d+"s",
()=>{

decade=d;
page=0;

buildFilters();
render();

},
decade===d
)

);

}


buildFilters();

render();

</script>

</body>
</html>
