<head>

<title>CD Wallet</title>
 
<style>
:root {
  --header:34px;
  --toolbar:64px;
  --bg:#141516;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body {
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header {
  height:var(--header);
  flex:0 0 var(--header);
  padding:9px 15px 4px;
  display:flex;
  align-items:end;
  justify-content:flex-end;
}

#count {
  font-size:10px;
  color:#929598;
  letter-spacing:.1em;
}

.stage {
  flex:1 1 auto;
  min-height:0;
  width:100%;
  padding:2px 8px 6px;
  display:flex;
  justify-content:center;
  align-items:stretch;
}

.case {
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  min-height:0;
  border-radius:19px;

  background:
    radial-gradient(
      ellipse at 18% 8%,
      rgba(255,255,255,.04),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 80% 75%,
      rgba(0,0,0,.38),
      transparent 55%
    ),
    repeating-linear-gradient(
      43deg,
      rgba(255,255,255,.018) 0 1px,
      rgba(0,0,0,.035) 1px 3px
    ),
    repeating-linear-gradient(
      -43deg,
      rgba(255,255,255,.012) 0 1px,
      transparent 1px 3px
    ),
    #202122;

  border:2px solid #090a0a;

  box-shadow:
    0 6px 17px rgba(0,0,0,.72),
    inset 0 0 20px rgba(0,0,0,.75);
}

.case:after {
  content:"";
  position:absolute;
  inset:6px;
  border-radius:14px;
  border:2px solid rgba(105,108,110,.6);
  pointer-events:none;
}

.case:before {
  content:"";
  position:absolute;
  inset:12px;
  border-radius:11px;
  border:1px dashed rgba(160,163,165,.36);
  pointer-events:none;
}

.page-stack {
  position:absolute;
  z-index:1;
  top:24px;
  left:25px;
  right:18px;
  bottom:27px;
  border-radius:3px;
  background:#121314;

  box-shadow:
    3px 3px 0 rgba(200,205,205,.13),
    6px 6px 0 rgba(0,0,0,.7),
    8px 8px 0 rgba(180,185,185,.08);
}

#sheetHost {
  position:absolute;
  z-index:5;
  top:20px;
  bottom:30px;
  left:18px;
  right:18px;
}

.spread {
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  transform-origin:50% 92%;
  will-change:transform,opacity;
  touch-action:none;
  user-select:none;
}

.sheet {
  position:relative;
  min-width:0;
  min-height:0;
}

.plastic {
  position:absolute;
  inset:0;
  padding:5px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:4px;

  border-radius:3px;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.018) 21%,
      rgba(255,255,255,.015) 48%,
      rgba(255,255,255,.065) 68%,
      rgba(255,255,255,.015)
    ),
    rgba(190,200,202,.045);

  border:1px solid rgba(220,225,225,.28);

  box-shadow:
    0 3px 7px rgba(0,0,0,.72),
    inset 0 0 10px rgba(255,255,255,.04);
}

.plastic:before {
  content:"";
  position:absolute;
  z-index:5;
  top:0;
  bottom:0;
  left:50%;
  width:2px;

  background:
    linear-gradient(
      to right,
      rgba(255,255,255,.17),
      rgba(0,0,0,.22)
    );

  pointer-events:none;
}

.plastic:after {
  content:"";
  position:absolute;
  z-index:8;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      118deg,
      rgba(255,255,255,.07) 0%,
      rgba(255,255,255,.015) 17%,
      transparent 28%,
      transparent 67%,
      rgba(255,255,255,.035) 79%,
      transparent 100%

}

.album {
  position:relative;
  min-width:0;
  min-height:0;
  padding:2px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:1px solid rgba(225,230,230,.16);
  background:rgba(255,255,255,.015);

  box-shadow:
    inset 0 0 7px rgba(255,255,255,.025);
}

.album:before {
  content:"";
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:0;
  height:4px;

  border-top:1px solid rgba(255,255,255,.18);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.05),
      rgba(255,255,255,.01)
    );

  pointer-events:none;
}

.album:after {
  content:"";
  position:absolute;
  z-index:6;
  left:1px;
  right:1px;
  top:0;
  height:13%;

  border-bottom:1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.07),
      rgba(255,255,255,.012)
    );

  pointer-events:none;
}

.cover {
  display:block;
  width:100%;
  max-width:100%;
  max-height:100%;
  aspect-ratio:1;
  object-fit:cover;

  background:
    linear-gradient(135deg,#343638,#242627);

  box-shadow:

}

.cover.loading {

}

.page-number {
  position:absolute;
  z-index:12;
  left:50%;
  bottom:33px;

  padding:2px 7px;
  border-radius:8px;

  background:rgba(15,16,17,.72);
  color:#aaa;

  font-size:8px;
  letter-spacing:.12em;

  pointer-events:none;
}

.toolbar {
  flex:0 0 calc(var(--toolbar) + env(safe-area-inset-bottom));
  height:calc(var(--toolbar) + env(safe-area-inset-bottom));

  background:#171819;

}

.tool {

  padding:2px;

}

.icon {

}

}

.icon-random:after {

.icon-filter:before {

  height:2px;

.icon-sort:before {

.icon-search:before {

  height:8px;
  left:5px;
  top:5px;
  border:2px solid currentColor;

}

.icon-search:after {
  content:"";
  position:absolute;
  width:7px;
  height:2px;
  left:12px;
  top:14px;
  background:currentColor;
  transform:rotate(-45deg);

}

.icon-add:before,

  left:4px;
  top:11px;
  width:14px;
  height:2px;

.icon-add:after {

.panel {

  position:fixed;
  z-index:100;

.close {

.option {

  color:#eee;
  font-size:15px;

.option.active {

.section {

  color:#8f9294;
  font-size:10px;
  text-transform:uppercase;

input {

  padding:14px;

  border:1px solid #484a4c;
  border-radius:7px;

  background:#292b2d;
  color:#fff;

.empty {

/* DESKTOP / TABLET */

@media(min-width:800px) {

  :root {
    --header:40px;

  }

  .page-stack {

  .spread {

  }

  .page-stack {
    top:22px;
    bottom:24px;
  }

  .page-number {
    bottom:30px;
  }
}

<script>

/* -------------------------------
   SETTINGS
-------------------------------- */

const SHEET_ID =
  "1jnhMnwfeY4QH002judHlnaOEkQ4_QJyjD_EDqljGomQ";


/* -------------------------------
   STATE
-------------------------------- */

let albums = [];

let page = 0;

let sort = "az";

let genre = null;
let mood = null;
let decade = null;

let visibleAlbums = [];

let dragging = false;

let startX = 0;
let startY = 0;

let dx = 0;

let ignoreClick = false;


const host =
  document.getElementById("sheetHost");


const isDesktop = () =>
  window.matchMedia("(min-width:800px)").matches;


const perView = () =>
  isDesktop() ? 12 : 6;


/* -------------------------------
   CSV PARSER
-------------------------------- */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const c = text[i];

    if (quoted) {

      if (c === '"' && text[i + 1] === '"') {

        field += '"';
        i++;

      } else if (c === '"') {

        quoted = false;

      } else {

        field += c;
      }

    } else {

      if (c === '"') {

        quoted = true;

      } else if (c === ',') {

        row.push(field);
        field = "";

      } else if (c === "\n") {

        row.push(
          field.replace(/\r$/, "")
        );

        rows.push(row);

        row = [];
        field = "";

      } else {

        field += c;
      }
    }
  }

  if (field || row.length) {

    row.push(field);
    rows.push(row);
  }

  const headers = rows.shift();

  return rows
    .filter(r => r.some(Boolean))
    .map(r =>
      Object.fromEntries(
        headers.map(
          (key, i) => [
            key,
            r[i] ?? ""
          ]
        )
      )
    );
}


/* -------------------------------
   LOAD GOOGLE SHEET
-------------------------------- */

async function loadAlbums() {

  try {

    /*
      Reads the Albums tab directly
      from your Google Sheet.
    */

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:csv&sheet=Albums&cacheBust=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Google Sheet could not be loaded"
      );
    }


    const rows =
      parseCSV(
        await response.text()
      );


    albums =
      rows
        .map(r => ({

          artist:
            r["Artist"] || "",

          album:
            r["Album"] || "",

          year:
            Number(
              r["Release Year"]
            ) || 0,

          genre:
            r["Genre"] ||
            "Uncategorized",

          moods: [
            r["Mood 1"],
            r["Mood 2"]
          ].filter(Boolean),

          acquired:
            Number(
              r["Acquired Year"]
            ) || null,

          appleID:
            r["Apple ID"] ||
            null,

          spotifyURL:
            r["Spotify URL"] ||
            null,

          artwork:
            null

        }))
        .filter(
          a =>
            a.artist &&
            a.album
        );


    buildFilters();

    render();


  } catch (error) {

    console.error(error);

    document.getElementById(
      "count"
    ).textContent =
      "ALBUM DATA ERROR";


    host.innerHTML =
      '<div style="' +
      'padding:30px;' +
      'color:#bbb;' +
      'line-height:1.5' +
      '">' +
      'Could not load the Google Sheet. ' +
      'Make sure the sheet is shared for public viewing.' +
      '</div>';
  }
}


/* -------------------------------
   SPOTIFY
-------------------------------- */

function spotify(album) {

  if (!album.spotifyURL) {
    return;
  }

  window.location.href =
    album.spotifyURL;
}


/* -------------------------------
   APPLE ARTWORK
-------------------------------- */

function normalize(string) {

  return String(string)

    .toLowerCase()

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-z0-9]/g,
      ""
    );
}


async function resolveArtwork(album) {

  if (album.artwork) {

    return album.artwork;
  }


  /*
    First choice:
    exact Apple ID from spreadsheet.
  */

  if (album.appleID) {

    try {

      const response =
        await fetch(
          "https://itunes.apple.com/lookup?id=" +
          album.appleID +
          "&entity=album"
        );


      const data =
        await response.json();


      const result =
        data.results.find(
          item =>
            item.wrapperType ===
              "collection" &&
            item.artworkUrl100
        );


      if (result) {

        album.artwork =
          result.artworkUrl100

            .replace(
              /100x100bb/,
              "600x600bb"
            )

            .replace(
              /100x100/,
              "600x600"
            );


        return album.artwork;
      }

    } catch (error) {

      console.warn(
        "Apple lookup failed:",
        album.artist,
        album.album
      );
    }
  }


  /*
    Fallback:
    search Apple using artist + album.

    This means new spreadsheet albums
    can still display artwork even when
    Apple ID hasn't been filled yet.
  */

  const terms = [

    album.artist +
      " " +
      album.album,

    album.album +
      " " +
      album.artist

  ];


  for (const term of terms) {

    try {

      const response =
        await fetch(

          "https://itunes.apple.com/search" +

          "?term=" +
          encodeURIComponent(term) +

          "&entity=album" +

          "&country=US" +

          "&limit=25"

        );


      const data =
        await response.json();


      let best = null;
      let bestScore = -999;


      const targetArtist =
        normalize(album.artist);


      const targetTitle =
        normalize(album.album);


      for (
        const result
        of data.results || []
      ) {

        const resultArtist =
          normalize(
            result.artistName || ""
          );


        const resultTitle =
          normalize(
            result.collectionName || ""
          );


        let score = 0;


        if (
          resultArtist ===
          targetArtist
        ) {

          score += 20;

        } else if (

          resultArtist.includes(
            targetArtist
          ) ||

          targetArtist.includes(
            resultArtist
          )

        ) {

          score += 12;
        }


        if (
          resultTitle ===
          targetTitle
        ) {

          score += 25;

        } else if (

          resultTitle.includes(
            targetTitle
          ) ||

          targetTitle.includes(
            resultTitle
          )

        ) {

          score += 15;
        }


        if (
          result.releaseDate &&
          album.year
        ) {

          const resultYear =
            new Date(
              result.releaseDate
            ).getFullYear();


          const difference =
            Math.abs(
              resultYear -
              album.year
            );


          if (difference === 0) {

            score += 6;

          } else if (
            difference <= 2
          ) {

            score += 4;

          } else if (
            difference <= 5
          ) {

            score += 1;
          }
        }


        const title =
          (
            result.collectionName ||
            ""
          ).toLowerCase();


        if (
          title.includes("tribute")
        ) {
          score -= 30;
        }


        if (
          title.includes("karaoke")
        ) {
          score -= 40;
        }


        if (
          title.includes(
            "instrumental"
          )
        ) {
          score -= 20;
        }


        if (
          title.includes("single")
        ) {
          score -= 15;
        }


        if (
          score >
          bestScore
        ) {

          bestScore =
            score;

          best =
            result;
        }
      }


      if (
        best &&
        best.artworkUrl100
      ) {

        album.artwork =
          best.artworkUrl100

            .replace(
              /100x100bb/,
              "600x600bb"
            )

            .replace(
              /100x100/,
              "600x600"
            );


        return album.artwork;
      }


    } catch (error) {

      console.warn(
        "Artwork search failed:",
        album.artist,
        album.album
      );
    }
  }


  return null;
}


async function loadArtwork(
  album,
  image
) {

  const url =
    await resolveArtwork(
      album
    );


  if (url) {

    image.src = url;

    image.classList.remove(
      "loading"
    );
  }
}


/* -------------------------------
   FILTER + SORT
-------------------------------- */

function filtered() {

  const search =
    (
      document.getElementById(
        "searchBox"
      ).value || ""
    ).toLowerCase();


  let results =
    albums.filter(album => {

      const genreMatch =
        !genre ||
        album.genre === genre;


      const moodMatch =
        !mood ||
        album.moods.includes(
          mood
        );


      const decadeMatch =
        !decade ||
        (
          Math.floor(
            album.year / 10
          ) * 10
        ) === decade;


      const searchMatch =
        !search ||
        (
          album.artist +
          " " +
          album.album
        )
          .toLowerCase()
          .includes(search);


      return (
        genreMatch &&
        moodMatch &&
        decadeMatch &&
        searchMatch
      );
    });


  switch (sort) {

    case "az":

      results.sort(
        (a,b) =>
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "za":

      results.sort(
        (a,b) =>
          b.artist.localeCompare(
            a.artist
          )
      );

      break;


    case "old":

      results.sort(
        (a,b) =>
          a.year -
          b.year ||
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "new":

      results.sort(
        (a,b) =>
          b.year -
          a.year ||
          a.artist.localeCompare(
            b.artist
          )
      );

      break;


    case "historicOld":

      results.sort(
        (a,b) => {

          if (
            a.acquired === null &&
            b.acquired === null
          ) {

            return (
              a.artist.localeCompare(
                b.artist
              )
            );
          }


          if (
            a.acquired === null
          ) {
            return 1;
          }


          if (
            b.acquired === null
          ) {
            return -1;
          }


          return (
            a.acquired -
            b.acquired ||
            a.artist.localeCompare(
              b.artist
            )
          );
        }
      );

      break;


    case "historicNew":

      results.sort(
        (a,b) => {

          if (
            a.acquired === null &&
            b.acquired === null
          ) {

            return (
              a.artist.localeCompare(
                b.artist
              )
            );
          }


          if (
            a.acquired === null
          ) {
            return 1;
          }


          if (
            b.acquired === null
          ) {
            return -1;
          }


          return (
            b.acquired -
            a.acquired ||
            a.artist.localeCompare(
              b.artist
            )
          );
        }
      );

      break;
  }


  return results;
}


/* -------------------------------
   BUILD WALLET PAGE
-------------------------------- */

function makeSheet(items) {

  const sheet =
    document.createElement(
      "div"
    );


  sheet.className =
    "sheet";


  const plastic =
    document.createElement(
      "div"
    );


  plastic.className =
    "plastic";


  sheet.appendChild(
    plastic
  );


  if (!items.length) {

    plastic.innerHTML =
      '<div class="empty"></div>';

    return sheet;
  }


  items.forEach(album => {

    const pocket =
      document.createElement(
        "div"
      );


    pocket.className =
      "album";


    const image =
      document.createElement(
        "img"
      );


    image.className =
      "cover loading";


    image.alt =
      album.artist +
      " — " +
      album.album;


    pocket.appendChild(
      image
    );


    pocket.addEventListener(
      "click",
      () => {

        if (!ignoreClick) {

          spotify(album);
        }
      }
    );


    plastic.appendChild(
      pocket
    );


    loadArtwork(
      album,
      image
    );
  });


  return sheet;
}


/* -------------------------------
   RENDER
-------------------------------- */

function render() {

  visibleAlbums =
    filtered();


  const albumsPerView =
    perView();


  const totalViews =
    Math.max(
      1,
      Math.ceil(
        visibleAlbums.length /
        albumsPerView
      )
    );


  if (
    page >=
    totalViews
  ) {

    page =
      totalViews - 1;
  }


  host.innerHTML =
    "";


  const spread =
    document.createElement(
      "div"
    );


  spread.className =
    "spread";


  const start =
    page *
    albumsPerView;


  spread.appendChild(

    makeSheet(

      visibleAlbums.slice(
        start,
        start + 6
      )

    )

  );


  if (
    isDesktop()
  ) {

    spread.appendChild(

      makeSheet(

        visibleAlbums.slice(
          start + 6,
          start + 12
        )

      )

    );
  }


  host.appendChild(
    spread
  );


  document.getElementById(
    "count"
  ).textContent =
    visibleAlbums.length +
    " ALBUMS";


  const totalPhysicalPages =
    Math.max(
      1,
      Math.ceil(
        visibleAlbums.length /
        6
      )
    );


  const firstPhysicalPage =
    page *
    (
      isDesktop()
        ? 2
        : 1
    ) +
    1;


  if (
    isDesktop()
  ) {

    const second =
      Math.min(
        firstPhysicalPage + 1,
        totalPhysicalPages
      );


    document.getElementById(
      "pageNumber"
    ).textContent =

      firstPhysicalPage +

      (
        second >
        firstPhysicalPage

          ? "–" + second

          : ""
      ) +

      " / " +

      totalPhysicalPages;

  } else {

    document.getElementById(
      "pageNumber"
    ).textContent =

      firstPhysicalPage +

      " / " +

      totalPhysicalPages;
  }


  bindSwipe(
    spread
  );
}


/* -------------------------------
   SWIPE
-------------------------------- */

function bindSwipe(element) {

  element.addEventListener(
    "pointerdown",
    event => {

      dragging = true;

      startX =
        event.clientX;

      startY =
        event.clientY;

      dx = 0;

      ignoreClick =
        false;


      element.setPointerCapture(
        event.pointerId
      );


      element.style.transition =
        "none";
    }
  );


  element.addEventListener(
    "pointermove",
    event => {

      if (!dragging) {
        return;
      }


      dx =
        event.clientX -
        startX;


      const dy =
        event.clientY -
        startY;


      if (
        Math.abs(dx) >
        8
      ) {

        ignoreClick =
          true;
      }


      if (
        Math.abs(dx) >
        Math.abs(dy)
      ) {

        event.preventDefault();


        element.style.transform =

          "translate3d(" +

          dx +

          "px,-" +

          Math.min(
            9,
            Math.abs(dx) / 20
          ) +

          "px,0) rotate(" +

          dx / 40 +

          "deg)";
      }
    }
  );


  element.addEventListener(
    "pointerup",
    () => {

      if (!dragging) {
        return;
      }


      dragging =
        false;


      const threshold =
        Math.min(
          110,
          window.innerWidth *
          .15
        );


      if (
        Math.abs(dx) >
        threshold
      ) {

        turn(
          dx < 0
            ? 1
            : -1,
          element
        );

      } else {

        snapBack(
          element
        );
      }
    }
  );


  element.addEventListener(
    "pointercancel",
    () => {

      dragging =
        false;

      snapBack(
        element
      );
    }
  );
}


function snapBack(
  element
) {

  element.style.transition =
    "transform .18s cubic-bezier(.2,.8,.2,1)";


  element.style.transform =
    "translate3d(0,0,0) rotate(0deg)";


  setTimeout(
    () =>
      ignoreClick =
        false,
    210
  );
}


function turn(
  direction,
  element
) {

  const total =
    Math.ceil(
      visibleAlbums.length /
      perView()
    );


  if (
    (
      direction === 1 &&
      page >= total - 1
    ) ||
    (
      direction === -1 &&
      page <= 0
    )
  ) {

    snapBack(
      element
    );

    return;
  }


  element.style.transition =
    "transform .24s ease-in, opacity .2s ease-in";


  element.style.opacity =
    ".15";


  element.style.transform =

    "translate3d(" +

    (
      direction === 1
        ? "-125vw"
        : "125vw"
    ) +

    ",-14px,0) rotate(" +

    (
      direction === 1
        ? "-8deg"
        : "8deg"
    ) +

    ")";


  setTimeout(
    () => {

      page +=
        direction;


      render();


      const next =
        host.firstChild;


      next.style.transition =
        "none";


      next.style.transform =

        "translate3d(" +

        (
          direction === 1
            ? "20px"
            : "-20px"
        ) +

        ",0,0)";


      requestAnimationFrame(
        () =>
          requestAnimationFrame(
            () => {

              next.style.transition =
                "transform .16s ease-out";


              next.style.transform =
                "translate3d(0,0,0)";
            }
          )
      );


      setTimeout(
        () =>
          ignoreClick =
            false,
        200
      );

    },
    220
  );
}


/* -------------------------------
   RANDOM
-------------------------------- */

function randomAlbum() {

  visibleAlbums =
    filtered();


  if (
    !visibleAlbums.length
  ) {
    return;
  }


  const album =
    visibleAlbums[
      Math.floor(
        Math.random() *
        visibleAlbums.length
      )
    ];


  spotify(
    album
  );
}


/* -------------------------------
   PANELS
-------------------------------- */

function openPanel(id) {

  closePanels();

  document
    .getElementById(id)
    .classList.add("open");
}


function closePanels() {

  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      panel =>
        panel.classList.remove(
          "open"
        )
    );
}


function setSort(value) {

  sort =
    value;

  page =
    0;

  closePanels();

  render();
}


/* -------------------------------
   FILTER MENU
-------------------------------- */

function addFilter(
  label,
  callback,
  active
) {

  const button =
    document.createElement(
      "button"
    );


  button.className =
    "option" +
    (
      active
        ? " active"
        : ""
    );


  button.textContent =
    label;


  button.onclick =
    callback;


  document
    .getElementById(
      "filters"
    )
    .appendChild(
      button
    );
}


function buildFilters() {

  const filters =
    document.getElementById(
      "filters"
    );


  filters.innerHTML =
    '<div class="section">Genre</div>';


  addFilter(

    "All genres",

    () => {

      genre = null;
      page = 0;

      buildFilters();
      render();
    },

    !genre

  );


  [
    ...new Set(
      albums.map(
        album =>
          album.genre
      )
    )
  ]

    .sort()

    .forEach(
      value => {

        addFilter(

          value,

          () => {

            genre =
              value;

            page =
              0;

            buildFilters();

            render();
          },

          genre === value

        );
      }
    );


  filters.insertAdjacentHTML(

    "beforeend",

    '<div class="section">Mood</div>'

  );


  addFilter(

    "All moods",

    () => {

      mood = null;
      page = 0;

      buildFilters();
      render();
    },

    !mood

  );


  [
    ...new Set(
      albums.flatMap(
        album =>
          album.moods
      )
    )
  ]

    .sort()

    .forEach(
      value => {

        addFilter(

          value,

          () => {

            mood =
              value;

            page =
              0;

            buildFilters();

            render();
          },

          mood === value

        );
      }
    );


  filters.insertAdjacentHTML(

    "beforeend",

    '<div class="section">Decade</div>'

  );


  addFilter(

    "All decades",

    () => {

      decade = null;
      page = 0;

      buildFilters();
      render();
    },

    !decade

  );


  [
    ...new Set(

      albums

        .filter(
          album =>
            album.year
        )

        .map(
          album =>
            Math.floor(
              album.year / 10
            ) * 10
        )

    )
  ]

    .sort(
      (a,b) =>
        a - b
    )

    .forEach(
      value => {

        addFilter(

          value + "s",

          () => {

            decade =
              value;

            page =
              0;

            buildFilters();

            render();
          },

          decade === value

        );
      }
    );
}


/* -------------------------------
   DESKTOP / MOBILE SWITCH
-------------------------------- */

let lastDesktop =
  isDesktop();


window.addEventListener(
  "resize",
  () => {

    const nowDesktop =
      isDesktop();


    if (
      nowDesktop !==
      lastDesktop
    ) {

      lastDesktop =
        nowDesktop;

      page =
        0;

      render();
    }
  }
);


/* -------------------------------
   START
-------------------------------- */

loadAlbums();

</script>
